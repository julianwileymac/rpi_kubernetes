# =============================================================================
# Kustomization - Root
# =============================================================================
# Main kustomization file for deploying all cluster resources.
# Usage: kubectl apply -k kubernetes/
# =============================================================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: rpi-k8s-cluster

# Common labels applied to all resources
commonLabels:
  app.kubernetes.io/managed-by: rpi-k8s-cluster
  app.kubernetes.io/part-of: rpi-k8s-platform

# Resources to include
resources:
  # Namespaces first
  - namespaces/namespaces.yaml
  
  # Storage
  - storage/
  
  # Base services
  - base-services/minio/
  - base-services/postgresql/
  - base-services/redis/
  - base-services/mlflow/
  - base-services/jupyterhub/
  - base-services/dask-ray/
  - base-services/management/
  - base-services/chromadb/
  - base-services/ragflow/
  - base-services/datahub/

  # Streaming platform
  - base-services/kafka/
  - base-services/schema-registry/
  - base-services/flink/

  # Public web — julianwiley.com personal portal (Next.js standalone)
  - base-services/portal/

  # Internet edge — Cloudflare Tunnel for outbound public exposure
  - base-services/cloudflared/

  # Observability stack
  - observability/otel-collector/
  - observability/jaeger/
  - observability/victoriametrics/
  - observability/prometheus/
  - observability/grafana/flink-dashboard-configmap.yaml
  
  # MLOps
  - mlops/argo-workflows/
  - mlops/dagster/
  - mlops/pipelines/
  - mlops/bentoml/
  
  # Note: kube-prometheus-stack (Grafana/Prometheus), Loki, Milvus deployed via Helm separately.
  # Loki: kubernetes/observability/loki/values.yaml + bootstrap/scripts/install-loki.sh
  # Prometheus stack: kubernetes/observability/prometheus/values.yaml
  # Strimzi Kafka Operator: kubernetes/base-services/kafka/values.yaml + bootstrap/scripts/install-flink.sh
  # Flink Kubernetes Operator: kubernetes/base-services/flink/values.yaml + bootstrap/scripts/install-flink.sh

# ConfigMap generators (if needed)
# configMapGenerator:
#   - name: cluster-config
#     literals:
#       - CLUSTER_NAME=rpi-k8s-cluster

# Secret generators (if needed)
# secretGenerator:
#   - name: cluster-secrets
#     literals:
#       - SECRET_KEY=changeme
