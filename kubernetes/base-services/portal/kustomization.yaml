# =============================================================================
# Kustomization — julianwiley-portal
# =============================================================================
# Apply with:  kubectl apply -k kubernetes/base-services/portal/
# (or transitively via the cluster root: kubectl apply -k kubernetes/)
# =============================================================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: web

resources:
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

commonLabels:
  app.kubernetes.io/name: portal
  app.kubernetes.io/component: web
  app.kubernetes.io/part-of: julianwiley-portal
