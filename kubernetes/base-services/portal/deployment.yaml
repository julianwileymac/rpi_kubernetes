# =============================================================================
# julianwiley-portal — Deployment
# =============================================================================
# Stateless Next.js (standalone) server. Two replicas with a RollingUpdate
# strategy so blue/green deploys stay zero-downtime; the app holds no local
# state (sessions are JWT, blog content is baked into the image).
#
# The portal image is multi-arch (linux/amd64 + linux/arm64) so it can run on
# the Ubuntu control plane OR the four RPi5 ARM workers. We don't pin the
# arch; let the scheduler spread replicas across nodes.
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: web
  labels:
    app: portal
    app.kubernetes.io/name: portal
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: julianwiley-portal
    app.kubernetes.io/managed-by: rpi-k8s-cluster
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: portal
  template:
    metadata:
      labels:
        app: portal
        app.kubernetes.io/name: portal
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: julianwiley-portal
        app.kubernetes.io/managed-by: rpi-k8s-cluster
    spec:
      automountServiceAccountToken: false
      # CI publishes amd64-only images on every push to main; multi-arch
      # only fires for `v*.*.*` tags. Pin scheduling to amd64 nodes
      # (the `julian-wiley-ubuntu-desktop` control plane) so we never
      # land on the arm64 RPi5 workers and crash with exec-format-error.
      # When a tagged release ships an arm64 layer too, drop this
      # nodeSelector to spread across all 5 nodes.
      nodeSelector:
        kubernetes.io/arch: amd64
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: portal
          # Pin to a sha-tag rather than :latest so kubelet's
          # imagePullPolicy: IfNotPresent caching can't strand the
          # cluster on a stale image. Bump on every successful release.
          image: ghcr.io/julianwileymac/portal:sha-d2f8c2b
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: portal-config
            - secretRef:
                name: portal-credentials
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Probes hit the NextAuth providers endpoint because it is:
          #   - excluded from middleware (api/auth is in the middleware
          #     matcher's negative-lookahead, so no redirect chains)
          #   - always 200 (returns a JSON map of registered providers)
          #   - cheap (no DB / OIDC round-trip)
          # Probing `/` was misbehaving because Next.js's prefetch-aware
          # rendering can briefly redirect anonymous visits to /app/
          # behind the scenes during HTML negotiation, blowing the
          # kubelet's 10-redirect ceiling.
          livenessProbe:
            httpGet:
              path: /api/auth/providers
              port: http
              httpHeaders:
                - name: Accept
                  value: application/json
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/auth/providers
              port: http
              httpHeaders:
                - name: Accept
                  value: application/json
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # `next start` (and the standalone server) needs a writable
          # /app/.next/cache for the on-disk LRU cache. A small emptyDir
          # is enough; the rest of the rootfs stays read-only.
          volumeMounts:
            - name: nextjs-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nextjs-cache
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: portal
