# =============================================================================
# julianwiley-portal — Secret (PLACEHOLDERS — do NOT commit real values)
# =============================================================================
# IMPORTANT: every value here must be replaced before applying to the cluster.
# This file ships with safe placeholders so the manifests still apply cleanly
# during a fresh bootstrap. Recommended override flow:
#
#   1. Generate AUTH_SECRET:
#        openssl rand -base64 32
#
#   2. Patch the live secret without committing creds:
#        kubectl -n web create secret generic portal-credentials \
#          --from-literal=AUTH_SECRET="$(openssl rand -base64 32)" \
#          --from-literal=AUTH_MICROSOFT_ENTRA_ID_ID="..." \
#          --from-literal=AUTH_MICROSOFT_ENTRA_ID_SECRET="..." \
#          --from-literal=AUTH_GOOGLE_ID="..." \
#          --from-literal=AUTH_GOOGLE_SECRET="..." \
#          --dry-run=client -o yaml | kubectl apply -f -
#
#   3. (later) Move to External Secrets / Sealed Secrets — see
#      kubernetes/mlops/pipelines/README.md for the cluster-wide direction.
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: portal-credentials
  namespace: web
  labels:
    app.kubernetes.io/name: portal
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: julianwiley-portal
type: Opaque
stringData:
  # NextAuth session signing secret (REQUIRED). Replace before applying.
  AUTH_SECRET: "REPLACE_ME_WITH_OPENSSL_RAND_BASE64_32"

  # Microsoft Entra ID OAuth credentials. Leave blank to disable the
  # provider — the dev Credentials provider is auto-disabled in production
  # so you must populate at least one real provider before users can log in.
  AUTH_MICROSOFT_ENTRA_ID_ID: ""
  AUTH_MICROSOFT_ENTRA_ID_SECRET: ""

  # Google OAuth credentials.
  AUTH_GOOGLE_ID: ""
  AUTH_GOOGLE_SECRET: ""
