# cloudflared-aqp — Token Secret template (do not apply as-is).
#
# The live token is retrieved from Cloudflare for tunnel:
#   name: aqp-fund-edge
#   id:   0cd12089-38ee-4dfb-95ba-65d2daa7b88b
#
# Create the real Secret out-of-band:
#
# PowerShell:
#   $token = cloudflared tunnel token aqp-fund-edge
#   kubectl -n edge create secret generic cloudflared-aqp-token `
#     --from-literal=token=$token `
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Bash:
#   token="$(cloudflared tunnel token aqp-fund-edge)"
#   kubectl -n edge create secret generic cloudflared-aqp-token \
#     --from-literal=token="$token" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# This template is intentionally not referenced by kustomization.yaml so
# `kubectl apply -k` never overwrites a real token with a placeholder.
apiVersion: v1
kind: Secret
metadata:
  name: cloudflared-aqp-token
  namespace: edge
  labels:
    app.kubernetes.io/name: cloudflared-aqp
    app.kubernetes.io/component: tunnel
    app.kubernetes.io/part-of: edge
type: Opaque
stringData:
  token: REPLACE_ME_cloudflared_tunnel_token
