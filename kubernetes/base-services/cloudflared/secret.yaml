# =============================================================================
# cloudflared — Tunnel credentials (PLACEHOLDER — replace before applying)
# =============================================================================
# This Secret holds the JSON credential file that cloudflared uses to
# authenticate the tunnel against Cloudflare's edge. The placeholder below
# is INTENTIONALLY invalid so a fresh `kubectl apply -k kubernetes/` does
# NOT silently activate a broken tunnel.
#
# Bootstrap procedure (run once on a workstation with `cloudflared` installed
# and a Cloudflare account that owns julianwiley.com):
#
#   # 1. Authenticate
#   cloudflared tunnel login
#
#   # 2. Create the named tunnel (matches `tunnel:` in configmap.yaml)
#   cloudflared tunnel create julianwiley-portal
#   #     -> writes ~/.cloudflared/<tunnel-id>.json
#
#   # 3. Route the apex + www CNAMEs to the tunnel
#   cloudflared tunnel route dns julianwiley-portal julianwiley.com
#   cloudflared tunnel route dns julianwiley-portal www.julianwiley.com
#
#   # 4. Push the credentials file into the cluster Secret
#   kubectl -n edge create secret generic cloudflared-credentials \
#     --from-file=credentials.json=$HOME/.cloudflared/<tunnel-id>.json \
#     --dry-run=client -o yaml | kubectl apply -f -
#
#   # 5. Restart the tunnel deployment to pick up the real credentials
#   kubectl -n edge rollout restart deploy/cloudflared
#
# After this, traffic to https://julianwiley.com is encrypted by Cloudflare,
# tunneled outbound from the cluster (no port-forward required), and
# delivered to ingress-nginx via the cluster-internal Service URL.
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: cloudflared-credentials
  namespace: edge
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/component: tunnel
    app.kubernetes.io/part-of: edge
type: Opaque
stringData:
  credentials.json: |
    {
      "AccountTag":   "REPLACE_ME_account_tag",
      "TunnelSecret": "REPLACE_ME_tunnel_secret",
      "TunnelID":     "REPLACE_ME_tunnel_id"
    }
