# =============================================================================
# Kustomization — cloudflared
# =============================================================================
# Apply with:  kubectl apply -k kubernetes/base-services/cloudflared/
# =============================================================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: edge

# NOTE: secret.yaml is NOT in the resources list. The
# `cloudflared-credentials` Secret is created out-of-band via
#   kubectl -n edge create secret generic cloudflared-credentials \
#     --from-file=credentials.json=$HOME/.cloudflared/<tunnel-id>.json
# (see README) so a `kubectl apply -k` does NOT clobber a real
# tunnel JSON with the committed placeholder. The committed
# secret.yaml stays as a template + bootstrap documentation.
resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml

commonLabels:
  app.kubernetes.io/name: cloudflared
  app.kubernetes.io/component: tunnel
  app.kubernetes.io/part-of: edge
