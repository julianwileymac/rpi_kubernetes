# =============================================================================
# Kustomization — cloudflared
# =============================================================================
# Apply with:  kubectl apply -k kubernetes/base-services/cloudflared/
# =============================================================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: edge

resources:
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml

commonLabels:
  app.kubernetes.io/name: cloudflared
  app.kubernetes.io/component: tunnel
  app.kubernetes.io/part-of: edge
