# =============================================================================
# kube-prometheus-stack Helm Values
# =============================================================================
# Install with:
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm repo update
#   helm install prometheus prometheus-community/kube-prometheus-stack \
#     --namespace observability --create-namespace -f values.yaml
# =============================================================================

fullnameOverride: prometheus

# Alertmanager
alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
          storageClassName: local-path
  ingress:
    enabled: true
    hosts:
      - alertmanager.local
    ingressClassName: nginx

# Default rules
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: true
    general: true
    k8s: true
    kubeApiserver: true
    kubePrometheusGeneral: true
    kubePrometheusNodeAlerting: true
    kubeScheduler: true
    kubeStateMetrics: true
    kubelet: true
    network: true
    node: true
    prometheus: true

# Grafana
grafana:
  enabled: true
  adminPassword: admin123

  initChownData:
    enabled: false

  persistence:
    enabled: true
    size: 5Gi
    storageClassName: local-path

  service:
    port: 3000
    type: LoadBalancer

  ingress:
    enabled: true
    hosts:
      - grafana.local
    ingressClassName: nginx

  # Install the Redis data source plugin so the Grafana UI can run Redis
  # commands (TS.RANGE, FT.INFO, JSON.GET, INFO, etc.) directly against the
  # shared Redis 8 Stack for the document store / cache dashboards.
  plugins:
    - redis-datasource

  # Mirror the Redis password into Grafana from a local Secret.  The Secret
  # itself is created by kubernetes/base-services/redis/secret.yaml (copied
  # into the observability namespace via Kustomize, or you can rely on the
  # mirror in otel-collector/redis-secret.yaml).
  envValueFrom:
    REDIS_PASSWORD:
      secretKeyRef:
        name: redis-credentials
        key: password
        optional: true

  additionalDataSources:
    - name: Jaeger
      type: jaeger
      access: proxy
      url: http://jaeger-query.observability:16686
      isDefault: false
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.observability:3100
      isDefault: false
    - name: VictoriaMetrics
      type: prometheus
      access: proxy
      url: http://victoriametrics.observability:8428
      isDefault: false
    # Redis direct-query data source for dashboards that use TS.*, FT.*, JSON.*
    # and INFO commands.  Backed by the Redis 8 Stack deployment in
    # data-services; the plugin speaks RESP over an outbound connection.
    - name: Redis
      type: redis-datasource
      access: proxy
      url: redis://redis.data-services.svc.cluster.local:6379
      isDefault: false
      jsonData:
        client: standalone
        poolSize: 5
        timeout: 10
        pingInterval: 30
        pipelineWindow: 0
      secureJsonData:
        password: $REDIS_PASSWORD

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          folder: ""
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default

  dashboards:
    default:
      k3s-cluster:
        gnetId: 15757
        revision: 1
        datasource: Prometheus
      node-exporter:
        gnetId: 1860
        revision: 27
        datasource: Prometheus
      minio:
        gnetId: 13502
        revision: 2
        datasource: Prometheus
      mlflow:
        gnetId: 12708
        revision: 1
        datasource: Prometheus
      ray:
        gnetId: 12006
        revision: 1
        datasource: Prometheus
      # oliver006/redis_exporter dashboard - server-level Redis metrics
      # (memory, ops/sec, keyspace, replication, slowlog counters).
      redis-overview:
        gnetId: 11835
        revision: 1
        datasource: Prometheus
      # Custom dashboard that queries the Redis data source directly so
      # the Grafana UI can show document-store specific counters
      # (cache hits/misses, FT.INFO on our indexes, TS.* ingest rate).
      redis-document-store:
        json: |
          {
            "title": "Redis Document Store",
            "uid": "redis-document-store",
            "schemaVersion": 39,
            "version": 1,
            "tags": ["redis", "document-store", "rag"],
            "timezone": "",
            "editable": true,
            "time": {"from": "now-6h", "to": "now"},
            "panels": [
              {
                "type": "stat",
                "title": "Cache Hits",
                "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
                "datasource": {"type": "redis-datasource", "uid": "redis"},
                "targets": [
                  {"type": "command", "command": "hget", "keyName": "stats:cache", "field": "hits", "refId": "A"}
                ]
              },
              {
                "type": "stat",
                "title": "Cache Misses",
                "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
                "datasource": {"type": "redis-datasource", "uid": "redis"},
                "targets": [
                  {"type": "command", "command": "hget", "keyName": "stats:cache", "field": "misses", "refId": "A"}
                ]
              },
              {
                "type": "stat",
                "title": "Documents Indexed (idx:documents)",
                "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
                "datasource": {"type": "redis-datasource", "uid": "redis"},
                "targets": [
                  {"type": "command", "command": "ft.info", "keyName": "idx:documents", "refId": "A"}
                ]
              },
              {
                "type": "stat",
                "title": "Chunks Indexed (idx:chunks)",
                "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
                "datasource": {"type": "redis-datasource", "uid": "redis"},
                "targets": [
                  {"type": "command", "command": "ft.info", "keyName": "idx:chunks", "refId": "A"}
                ]
              },
              {
                "type": "timeseries",
                "title": "Ingest Rate (stats:ingest:count)",
                "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
                "datasource": {"type": "redis-datasource", "uid": "redis"},
                "targets": [
                  {"type": "timeSeries", "command": "ts.range", "keyName": "stats:ingest:count", "refId": "A"}
                ]
              },
              {
                "type": "timeseries",
                "title": "Semantic Cache Latency (stats:semcache:latency)",
                "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
                "datasource": {"type": "redis-datasource", "uid": "redis"},
                "targets": [
                  {"type": "timeSeries", "command": "ts.range", "keyName": "stats:semcache:latency", "refId": "A"}
                ]
              },
              {
                "type": "timeseries",
                "title": "Redis Ops/sec (exporter)",
                "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
                "datasource": "Prometheus",
                "targets": [
                  {"expr": "rate(redis_commands_processed_total{service=\"redis-exporter\"}[5m])", "legendFormat": "ops", "refId": "A"}
                ]
              },
              {
                "type": "timeseries",
                "title": "Keyspace Hit Ratio (exporter)",
                "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
                "datasource": "Prometheus",
                "targets": [
                  {"expr": "rate(redis_keyspace_hits_total{service=\"redis-exporter\"}[5m]) / (rate(redis_keyspace_hits_total{service=\"redis-exporter\"}[5m]) + rate(redis_keyspace_misses_total{service=\"redis-exporter\"}[5m]))", "legendFormat": "hit-ratio", "refId": "A"}
                ]
              }
            ],
            "templating": {"list": []},
            "annotations": {"list": []}
          }
      workflow-orchestrators:
        json: |
          {
            "title": "Workflow Orchestrators - Argo and Dagster",
            "uid": "workflow-orchestrators",
            "schemaVersion": 39,
            "version": 1,
            "tags": ["argo", "dagster", "mlops"],
            "timezone": "",
            "editable": true,
            "time": {
              "from": "now-6h",
              "to": "now"
            },
            "panels": [
              {
                "type": "stat",
                "title": "Argo Targets Up",
                "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
                "datasource": null,
                "targets": [
                  {
                    "expr": "sum(up{job=~\".*argo-workflows-controller.*\"})",
                    "refId": "A"
                  }
                ],
                "options": {
                  "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
                  "colorMode": "value",
                  "graphMode": "none",
                  "justifyMode": "center"
                },
                "fieldConfig": {
                  "defaults": {
                    "thresholds": {
                      "mode": "absolute",
                      "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]
                    }
                  },
                  "overrides": []
                }
              },
              {
                "type": "stat",
                "title": "Dagster Targets Up",
                "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
                "datasource": null,
                "targets": [
                  {
                    "expr": "sum(up{job=~\".*dagster-webserver.*\"})",
                    "refId": "A"
                  }
                ],
                "options": {
                  "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
                  "colorMode": "value",
                  "graphMode": "none",
                  "justifyMode": "center"
                },
                "fieldConfig": {
                  "defaults": {
                    "thresholds": {
                      "mode": "absolute",
                      "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]
                    }
                  },
                  "overrides": []
                }
              },
              {
                "type": "timeseries",
                "title": "Argo Scrape Samples",
                "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
                "datasource": null,
                "targets": [
                  {
                    "expr": "sum(scrape_samples_scraped{job=~\".*argo-workflows-controller.*\"})",
                    "legendFormat": "argo-samples",
                    "refId": "A"
                  }
                ]
              },
              {
                "type": "timeseries",
                "title": "Dagster Scrape Samples",
                "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
                "datasource": null,
                "targets": [
                  {
                    "expr": "sum(scrape_samples_scraped{job=~\".*dagster-webserver.*\"})",
                    "legendFormat": "dagster-samples",
                    "refId": "A"
                  }
                ]
              },
              {
                "type": "timeseries",
                "title": "Argo Workflow Throughput (if exported)",
                "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
                "datasource": null,
                "targets": [
                  {
                    "expr": "sum(rate(argo_workflows_count[5m]))",
                    "legendFormat": "workflows/sec",
                    "refId": "A"
                  }
                ]
              },
              {
                "type": "timeseries",
                "title": "Dagster Process CPU (if exported)",
                "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
                "datasource": null,
                "targets": [
                  {
                    "expr": "sum(rate(process_cpu_seconds_total{job=~\".*dagster-webserver.*\"}[5m]))",
                    "legendFormat": "cpu-seconds/sec",
                    "refId": "A"
                  }
                ]
              }
            ],
            "templating": {"list": []},
            "annotations": {"list": []}
          }

# Disable components not available on k3s
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false

# kube-state-metrics
kubeStateMetrics:
  enabled: true

# Node exporter
nodeExporter:
  enabled: true
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

# Prometheus
prometheus:
  ingress:
    enabled: true
    hosts:
      - prometheus.local
    ingressClassName: nginx
  prometheusSpec:
    retention: 15d
    retentionSize: 15GB
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
          storageClassName: local-path
    remoteWrite:
      - url: http://victoriametrics.observability:8428/api/v1/write
        queueConfig:
          capacity: 10000
          maxSamplesPerSend: 1000
          maxShards: 200
    additionalScrapeConfigs:
      - job_name: minio
        metrics_path: /minio/v2/metrics/cluster
        scheme: http
        static_configs:
          - targets:
              - minio.data-services:9000
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
