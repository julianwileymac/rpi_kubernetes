# =============================================================================
# ServiceMonitors for Observability Stack
# =============================================================================
# ServiceMonitors tell Prometheus which services to scrape for metrics.
# =============================================================================

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: jaeger
  namespace: observability
  labels:
    app: jaeger
spec:
  selector:
    matchLabels:
      app: jaeger
  endpoints:
    - port: admin-http
      path: /metrics
      interval: 30s

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: victoriametrics
  namespace: observability
  labels:
    app: victoriametrics
spec:
  selector:
    matchLabels:
      app: victoriametrics
  endpoints:
    - port: http
      path: /metrics
      interval: 30s

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: otel-collector
  namespace: observability
  labels:
    app: otel-collector
spec:
  selector:
    matchLabels:
      app: otel-collector
  endpoints:
    - port: prometheus
      path: /metrics
      interval: 30s

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argo-workflows-controller
  namespace: observability
  labels:
    app: argo-workflows
spec:
  namespaceSelector:
    matchNames:
      - mlops
  selector:
    matchLabels:
      app: argo-workflows-controller-metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dagster-webserver
  namespace: observability
  labels:
    app: dagster
spec:
  namespaceSelector:
    matchNames:
      - mlops
  selector:
    matchLabels:
      app.kubernetes.io/instance: dagster
      app.kubernetes.io/name: dagster
  endpoints:
    - targetPort: 80
      path: /metrics
      interval: 30s

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: flink-metrics
  namespace: observability
  labels:
    app: flink
spec:
  namespaceSelector:
    matchNames:
      - flink
  selector:
    matchLabels:
      app: flink-trading-session
      component: metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kafka-metrics
  namespace: observability
  labels:
    app: kafka
spec:
  namespaceSelector:
    matchNames:
      - data-services
  selector:
    matchLabels:
      strimzi.io/cluster: trading-kafka
      strimzi.io/kind: Kafka
  endpoints:
    - port: tcp-prometheus
      path: /metrics
      interval: 30s

---
# KServe controller manager - exposes scheduler/queue metrics on :8080.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kserve-controller-manager
  namespace: observability
  labels:
    app: kserve
spec:
  namespaceSelector:
    matchNames:
      - kserve
  selector:
    matchLabels:
      control-plane: kserve-controller-manager
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: 30s

---
# vLLM CPU profile - exposes the OpenAI-compatible Prometheus endpoint at /metrics.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vllm-cpu-small
  namespace: observability
  labels:
    app: vllm
spec:
  namespaceSelector:
    matchNames:
      - ml-platform
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm-cpu-small
  endpoints:
    - port: http
      path: /metrics
      interval: 30s

---
# vLLM GPU profile - same scrape config, separate target so Grafana panels
# can split CPU vs GPU latency.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vllm-gpu
  namespace: observability
  labels:
    app: vllm
spec:
  namespaceSelector:
    matchNames:
      - ml-platform
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm-gpu
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
