[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpi_k8s_sdk"
version = "0.1.0"
description = "Python SDK for the rpi_kubernetes streaming + Flink control plane."
requires-python = ">=3.11"
authors = [{ name = "Julian Wiley" }]
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
streaming = [
    "confluent-kafka>=2.4",
    "aiokafka>=0.11",
    "fastavro>=1.9",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp>=1.24",
    "opentelemetry-instrumentation-confluent-kafka>=0.45b0",
    "opentelemetry-instrumentation-aiokafka>=0.45b0",
    "opentelemetry-instrumentation-httpx>=0.45b0",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["rpi_k8s_sdk*"]
