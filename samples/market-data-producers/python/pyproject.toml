[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpi-market-data-producers"
version = "0.1.0"
description = "Sample Kafka producers for the rpi_kubernetes trading-kafka cluster."
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.4",
    "fastavro>=1.9",
    "httpx>=0.27",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp>=1.24",
    "opentelemetry-instrumentation-confluent-kafka>=0.45b0",
    "opentelemetry-instrumentation-httpx>=0.45b0",
    "prometheus-client>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
polygon = ["polygon-api-client>=1.14"]
alpaca = ["alpaca-trade-api>=3.2"]
ibkr = ["ib_insync>=0.9.86"]
yfinance = ["yfinance>=0.2", "pandas>=2.1"]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["common*"]
