apiVersion: v1
kind: ConfigMap
metadata:
  name: market-data-producer-samples
data:
  KAFKA_BOOTSTRAP_SERVERS: "trading-kafka-kafka-bootstrap.data-services.svc.cluster.local:9094"
  KAFKA_SECURITY_PROTOCOL: "SASL_SSL"
  KAFKA_SASL_MECHANISM: "SCRAM-SHA-512"
  KAFKA_SASL_USERNAME: "producer-market"
  KAFKA_SSL_CA_LOCATION: "/etc/kafka/ca/ca.crt"
  KAFKA_SCHEMA_REGISTRY_URL: "http://apicurio-registry.data-services.svc.cluster.local:8080/apis/registry/v2"
  KAFKA_OTEL_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4317"
