[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alphavantage-client"
version = "0.1.0"
description = "Custom sync/async Alpha Vantage client engine with rate limiting, retries, caching, and typed responses for the rpi_kubernetes data layer."
authors = [{ name = "rpi-k8s-platform" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
    "tenacity>=8.2",
]

[project.optional-dependencies]
pandas = ["pandas>=2.1"]
fallback = ["alpha_vantage>=3.0"]
redis-cache = ["redis>=5.0"]
sqlite-cache = []
all = [
    "pandas>=2.1",
    "alpha_vantage>=3.0",
    "redis>=5.0",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "mypy>=1.8",
    "ruff>=0.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
alphavantage_client = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
